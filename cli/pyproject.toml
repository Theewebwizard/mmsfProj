[project]
name = "trustchain-verify"
version = "1.0.0"
description = "Offline verifier for TrustChain evidence bundles"
requires-python = ">=3.10"
dependencies = ["PyNaCl>=1.5.0"]

[project.scripts]
trustchain-verify = "trustchain_verify.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trustchain_verify"]
