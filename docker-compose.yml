# Prerequisite: python scripts/generate_keys.py   (creates ./keys, git-ignored)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustchain
      POSTGRES_USER: trustchain
      POSTGRES_PASSWORD: trustchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustchain"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./infra/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  witness:
    build:
      context: ./witness
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # The witness keeps its OWN state, independent of the primary database.
      WITNESS_DB_URL: sqlite+aiosqlite:////data/witness.db
      WITNESS_TOKEN: witness_secret_token_change_me
      WITNESS_KEY_DIR: /run/keys
      WITNESS_ALLOW_KEY_GENERATION: "false"
      WITNESS_LOG_ID: trustchain-log-v1
    volumes:
      - ./keys/witness:/run/keys:ro
      - witness_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      witness:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://trustchain:trustchain@postgres:5432/trustchain
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: trustchain-evidence
      MINIO_SECURE: "false"
      JWT_SECRET: change_me_in_production_min_32_chars_long
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "480"
      KEY_DIR: /run/keys
      ALLOW_KEY_GENERATION: "false"
      LOG_ID: trustchain-log-v1
      WITNESS_URL: http://witness:8001
      WITNESS_TOKEN: witness_secret_token_change_me
      EXPERIMENTS_DIR: /experiments
      TRUSTCHAIN_BACKEND_DIR: /app
      TRUSTCHAIN_WITNESS_DIR: /witness
    volumes:
      - ./keys/api:/run/keys:ro
      - ./experiments:/experiments
      - ./witness:/witness:ro

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  witness_data:
